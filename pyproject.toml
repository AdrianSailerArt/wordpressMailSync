[project]
name = "pressbot"
version = "0.1.0"
description = "Liest Musik-Pressemitteilungen aus einem IMAP-Postfach, schreibt sie per Claude SEO-gerecht um und veröffentlicht sie in WordPress."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.75",
    "beautifulsoup4>=4.12",
    "nh3>=0.2.17",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pressbot = "pressbot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pressbot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
